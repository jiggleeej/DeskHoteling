<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mindspace Desk Booking</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f5f3;color:#1a1a1a;padding:1.5rem}
.app{max-width:700px;margin:0 auto}
h1{font-size:20px;font-weight:500;margin-bottom:4px}
.sub{font-size:13px;color:#666;margin-bottom:1.5rem}
.date-nav{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem}
.date-nav button{background:#fff;border:1px solid #ddd;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:13px}
.date-nav button:hover{background:#f0f0ee}
.date-label{font-size:15px;font-weight:500;flex:1;text-align:center}
.layout-row{display:flex;gap:1.5rem;margin-bottom:1.5rem;flex-wrap:wrap}
.office-map{flex:0 0 200px}
.office-map h3,.time-panel h3{font-size:13px;color:#666;margin-bottom:8px;font-weight:400}
.map-wrap{border:1px solid #e0e0dd;border-radius:8px;background:#fafaf8;padding:8px}
.time-panel{flex:1;min-width:200px}
.time-grid{display:grid;grid-template-columns:56px 1fr}
.time-label{font-size:11px;color:#999;padding-right:6px;text-align:right;display:flex;align-items:center;justify-content:flex-end;height:32px}
.slot-row{display:flex;gap:3px;padding:2px 0;border-top:1px solid #eee;height:32px;align-items:center}
.slot{flex:1;height:26px;border-radius:4px;border:1px solid transparent}
.slot.free{background:#f0f0ee;border-color:#e0e0dd}
.slot.booked{background:#9fe1cb;border-color:#5dcaa5}
.slot.in-range{background:#c8eee3;border-color:#5dcaa5}
.slot.cancel-range{background:#fad4d4;border-color:#f09595}
.desk-labels{display:flex;gap:3px;padding-bottom:4px}
.desk-lbl{flex:1;font-size:10px;color:#888;text-align:center}
.legend{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:6px;font-size:12px;color:#666}
.leg-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.booking-panel{background:#fff;border:1px solid #e0e0dd;border-radius:12px;padding:1.25rem}
.tabs{display:flex;margin-bottom:1.25rem;border-bottom:1px solid #e0e0dd}
.tab{padding:8px 18px;font-size:13px;cursor:pointer;border:none;background:none;color:#666;border-bottom:2px solid transparent;margin-bottom:-1px}
